<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      rel="icon"
      {{
      if
      .IsHome
      }}id="favicon"
      {{
      end
      }}type="image/svg+xml"
      href="/favicon.svg"
    />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Senthilnathan"
      href="/index.xml"
    />
    <link rel="canonical" href="{{ .Permalink }}" />
    <title>
      {{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title
      }}{{ end }}
    </title>
    <meta
      name="title"
      content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}"
    />
    <meta
      name="description"
      content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.site_description }}{{ end }}"
    />
    <meta
      property="og:type"
      content="{{ if .IsPage }}article{{ else }}website{{ end }}"
    />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta
      property="og:title"
      content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}"
    />
    <meta
      property="og:description"
      content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.site_description }}{{ end }}"
    />
    {{ if .Params.hero_image }}
    <meta property="og:image" content="{{ .Params.hero_image | absURL }}" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:image"
      content="{{ .Params.hero_image | absURL }}"
    />
    {{ else }}
    <meta property="twitter:card" content="summary" />
    {{ end }}
    <meta
      property="twitter:title"
      content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}"
    />
    <meta
      property="twitter:description"
      content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.site_description }}{{ end }}"
    />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Geist", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        font-family: "Geist", sans-serif;
      }
    </style>
    <link rel="stylesheet" href="/stylesheets/global.css" />
    <link rel="stylesheet" href="/stylesheets/theme-toggle.css" />
    <script data-goatcounter="https://ssenthilnathan3.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    <!-- Theme: runs before paint to avoid flash -->
    <script src="/js/theme.js"></script>
    {{ block "custom_head" . }}{{ end }}
  </head>
  <body{{ if eq .Section "blog" }} class="blog-post-page"{{ end }}>
    <nav class="top-bar-nav" role="navigation" aria-label="Main navigation">
      <div class="top-bar-segments">
        <a href="/" class="top-bar-segment{{ if .IsHome }} active{{ end }}">home</a>
        <a href="/blog/" class="top-bar-segment{{ if and (not .IsHome) (or (eq .Section "blog") (in .RelPermalink "/blog/")) }} active{{ end }}">shelf</a>
        <a href="/photos/" class="top-bar-segment{{ if eq .Section "photos" }} active{{ end }}">photos</a>
        <a href="/about/" class="top-bar-segment{{ if eq .RelPermalink "/about/" }} active{{ end }}">about</a>
        <button id="topbar-ballistic" class="top-bar-segment ballistic" onclick="window.setChaosMode&amp;&amp;window.setChaosMode(!document.body.classList.contains('chaos-mode'))">🎉</button>
      </div>
    </nav>
    {{ block "main" . }}{{ end }} {{ block "custom_foot" . }}{{ end }}
    <script src="/js/chaos-toggle.js"></script>
  </body>
</html>
